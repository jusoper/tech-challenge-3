name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check src scripts tests

      - name: Ruff format check
        run: poetry run ruff format --check src scripts tests

      - name: Download and prepare medical dataset
        run: |
          poetry run python scripts/download_mtsamples.py
          poetry run python scripts/prepare_mtsamples.py --max-rows 4000 --seed 42

      - name: Pytest
        run: poetry run pytest

      - name: Train pipeline smoke
        run: poetry run python scripts/run_train_pipeline.py --seed 42
