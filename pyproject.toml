[project]
name = "triagem-tech-challenge"
version = "0.1.0"
description = "Tech Challenge FIAP Fase 3 — triagem de laudos médicos com FastAPI, CI/CD, Airflow e monitoramento."
authors = [{ name = "FIAP Tech Challenge Group" }]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "numpy>=1.26,<2",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "skl2onnx>=1.17",
    "onnxruntime>=1.17,<1.20",
]

[project.urls]
Repository = "https://github.com/jusoper/tech-challenge-3"

[tool.poetry]
packages = [{ include = "triagem", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.4"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
